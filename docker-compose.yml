services:
  db:
    image: postgres:16-alpine
    container_name: cobertura_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobertura_db
      POSTGRES_USER: cobertura_user
      POSTGRES_PASSWORD: cobertura_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobertura_user -d cobertura_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cobertura_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://cobertura_user:cobertura_pass@db:5432/cobertura_db
      SECRET_KEY: cambiar_esta_clave_en_produccion
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: cobertura_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
